name: Security

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web-audit:
    name: Web audit and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  rust-audit:
    name: Rust audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Tauri dependencies
        working-directory: src-tauri
        run: cargo audit
